spring.application.name=tienda

# Soporta variables manuales (DB_URL/DB_USERNAME/DB_PASSWORD) y variables nativas de Railway
# (MYSQLHOST, MYSQLPORT, MYSQL_DATABASE/MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD).
# En local (sin variables de entorno) conecta a MySQL local en localhost:3306/kult.
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:${MYSQLDATABASE:kult}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:Admin12345}}

# Pool Hikari robusto para conexiones remotas (Railway)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=600000

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}

server.port=${PORT:8080}

# Orígenes CORS permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.onrender.com,https://*.railway.app,https://*.vercel.app,https://*.netlify.app}

# Carga de imágenes del catálogo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
