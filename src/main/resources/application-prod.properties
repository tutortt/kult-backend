# =============================================================================
# KULT STUDIO · Perfil de PRODUCCIÓN (prod · Render + Railway MySQL Public)
# =============================================================================
# Soporta MYSQL_PUBLIC_URL (vía RailwayMysqlUrlPostProcessor), DB_URL o
# variables individuales (RAILWAY_TCP_PROXY_DOMAIN/PORT o MYSQLHOST/PORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://${RAILWAY_TCP_PROXY_DOMAIN:${MYSQLHOST:interchange.proxy.rlwy.net}}:${RAILWAY_TCP_PROXY_PORT:${MYSQLPORT:32005}}/${MYSQLDATABASE:${MYSQL_DATABASE:railway}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:}}}

# Pool Hikari ajustado para base de datos remota
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate (logs SQL apagados por defecto en producción)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# CORS para producción (configurable vía CORS_ORIGINS)
app.cors.allowed-origins=${CORS_ORIGINS:https://*.onrender.com,https://*.railway.app,https://*.vercel.app,https://*.netlify.app,http://localhost:*}
